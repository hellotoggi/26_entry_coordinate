<body>
<header><div class="brand"><span class="brand-symbol" aria-hidden="true">⌖</span>좌표 탐험대</div><div class="header-tools"><span class="total-label">맞힌 문제 <strong id="total-progress">0 / 25</strong></span><button class="utility" id="fullscreen">⛶ 전체 화면</button><button class="utility" id="reset">처음부터 ↻</button></div></header>
<main class="app">
<div class="navigation"><nav class="stage-nav" aria-label="학습 단계"><button class="stage-tab" data-stage="0">1. 점 고르기 <small id="stage-count-0">0 / 15</small></button><button class="stage-tab" data-stage="1">2. 위치 누르기 <small id="stage-count-1">0 / 5</small></button><button class="stage-tab" data-stage="2">3. 도착점 찾기 <small id="stage-count-2">0 / 5</small></button></nav><div class="lesson-tabs" role="tablist" aria-label="1단계 연습 선택" id="lesson-tabs"><button class="lesson-tab" role="tab" data-lesson="0">가로 X<span class="small-check"></span></button><button class="lesson-tab" role="tab" data-lesson="1">세로 Y<span class="small-check"></span></button><button class="lesson-tab" role="tab" data-lesson="2">X와 Y<span class="small-check"></span></button></div></div>

<div class="workspace"><section class="board-column" aria-label="문제 풀기"><div class="board-bar"><div class="board-title"><i aria-hidden="true"></i><span id="board-action">아래 초록색 점 중 하나를 누르세요.</span></div><div class="board-controls"><span class="board-size">실행 화면 480 × 270</span><label class="guide-switch"><input id="guides" type="checkbox" checked>마우스 보조선</label></div></div><div class="board-viewport" id="board-viewport"><div class="svg-wrap" id="svg-wrap"><svg id="board" viewBox="0 0 960 540" role="group" aria-label="좌표판"><defs><marker id="x-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#c63e45"/></marker><marker id="y-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#215faf"/></marker></defs><g id="grid-layer"></g><g id="hint-layer" pointer-events="none"></g><g id="guide-layer" pointer-events="none"></g><g id="path-layer" pointer-events="none"></g><g id="point-layer"></g><g id="bot-layer" pointer-events="none"></g><g id="answer-layer" pointer-events="none"></g><g id="cursor-layer" pointer-events="none"></g></svg></div></div><div class="board-footer"><div class="axis-key"><span class="x-text"><b>X</b> 가로</span><span class="y-text"><b>Y</b> 세로</span><span>작은 한 칸 = 10</span></div><div class="live-coord" id="live-coord" aria-hidden="true"></div></div></section>
<aside class="howto"><h2>이렇게 해 보세요</h2><ol id="howto-steps"></ol><div class="axis-reminder" id="axis-reminder"></div><button class="hint-button" id="hint" aria-pressed="false">💡 모르겠으면 힌트선 보기</button></aside></div>
<section class="response-bar" id="response-bar" aria-label="결과와 다음 문제"><div class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><button class="next-button" id="next" disabled>먼저 답을 눌러요</button></section>
</main>
<dialog class="celebration" id="celebration" aria-labelledby="celebration-title" aria-describedby="celebration-description"><canvas id="fireworks" aria-hidden="true"></canvas><div class="celebration-inner"><div class="celebration-medal" aria-hidden="true">★</div><h2 id="celebration-title"><span>정답!</span> <span>잘 찾았어요!</span></h2><p id="celebration-description"></p><button class="celebration-next" id="celebration-next" autofocus>다음 문제 →</button><button class="celebration-review" id="celebration-review">좌표판 다시 보기</button></div></dialog>
