<body>
<header><div class="brand"><span class="brand-symbol" aria-hidden="true">⌖</span>좌표 탐험대</div><div class="header-tools"><span class="total-label">맞힌 문제 <strong id="total-progress">0 / 25</strong></span><button class="utility" id="fullscreen">⛶ 전체 화면</button><button class="utility" id="reset">처음부터 ↻</button></div></header>
<main class="app">
<div class="navigation"><nav class="stage-nav" aria-label="학습 단계"><button class="stage-tab" data-stage="0">1. 점 고르기 <small id="stage-count-0">0 / 15</small></button><button class="stage-tab" data-stage="1">2. 위치 누르기 <small id="stage-count-1">0 / 5</small></button><button class="stage-tab" data-stage="2">3. 도착점 찾기 <small id="stage-count-2">0 / 5</small></button></nav><div class="lesson-tabs" role="tablist" aria-label="1단계 연습 선택" id="lesson-tabs"><button class="lesson-tab" role="tab" data-lesson="0">가로 X<span class="small-check"></span></button><button class="lesson-tab" role="tab" data-lesson="1">세로 Y<span class="small-check"></span></button><button class="lesson-tab" role="tab" data-lesson="2">X와 Y<span class="small-check"></span></button></div></div>

'use strict';
const LESSONS=[
 {key:'x',stage:0,label:'X좌표 연습',title:'X좌표가 같은 점을 찾아요',description:'아래 X값과 가로 위치가 같은 점을 눌러요. 높이는 달라도 괜찮아요.',tip:'X는 가로 위치예요. 오른쪽은 +, 왼쪽은 −예요.'},
 {key:'y',stage:0,label:'Y좌표 연습',title:'Y좌표가 같은 점을 찾아요',description:'아래 Y값과 세로 위치가 같은 점을 눌러요. 가로 위치는 달라도 괜찮아요.',tip:'Y는 세로 위치예요. 위쪽은 +, 아래쪽은 −예요.'},
 {key:'xy',stage:0,label:'XY좌표 연습',title:'두 좌표가 맞는 점을 찾아요',description:'X로 가로 위치를, Y로 세로 위치를 확인하고 점을 눌러요.',tip:'좌표는 (X, Y) 순서로 읽어요. 가로를 먼저, 세로를 다음에!'},
 {key:'hidden',stage:1,label:'숨은 점 찾기',title:'숫자만 보고 점을 찾아요',description:'점은 숨어 있어요. 아래 좌표의 위치를 찾아 화면을 눌러요.',tip:'중심 (0, 0)에서 X만큼 가로로, Y만큼 세로로 찾아가요. 작은 한 칸은 10이에요.'},
 {key:'move',stage:2,label:'도착점 예상',title:'엔트리봇은 어디로 갈까요?',description:'출발점에서 아래 값만큼 움직이면 어디일까요? 도착할 곳을 눌러요.',tip:'도착 좌표 = 출발 좌표 + 이동할 값. X와 Y를 각각 계산해요.'}
];
const randomInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const choose=arr=>arr[randomInt(0,arr.length-1)];
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randomInt(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestion(key,previous){
 let q;
 for(let attempt=0;attempt<100;attempt++){
  if(['x','y','xy'].includes(key)){
   const xs=shuffled([-200,-160,-120,-80,-40,0,40,80,120,160,200]).slice(0,5);
   const ys=shuffled([-100,-80,-60,-40,-20,0,20,40,60,80,100]).slice(0,5);
   const points=xs.map((x,i)=>({x,y:ys[i],label:String.fromCharCode(65+i)}));
   const target=choose(points);q={key,points,target:{...target}};
  }else if(key==='hidden'){
   q={key,points:[],target:{x:randomInt(-10,10)*20,y:randomInt(-5,5)*20}};
  }else{
   const start={x:randomInt(-8,8)*20,y:randomInt(-3,3)*20};
   const moves=[-80,-60,-40,-20,20,40,60,80];
   const dx=choose(moves.filter(n=>Math.abs(start.x+n)<=200));
   const dy=choose(moves.filter(n=>Math.abs(start.y+n)<=100));
   q={key,points:[],start,delta:{x:dx,y:dy},target:{x:start.x+dx,y:start.y+dy}};
   if(Math.abs(q.target.x)>200||Math.abs(q.target.y)>100)continue;
  }
  if(!previous || (key==='x'?q.target.x!==previous.target.x:key==='y'?q.target.y!==previous.target.y:q.target.x!==previous.target.x||q.target.y!==previous.target.y))return q;
 }
 return q;
}
function answerMatches(q,p){if(q.key==='x')return p.x===q.target.x;if(q.key==='y')return p.y===q.target.y;return Math.abs(p.x-q.target.x)<=8&&Math.abs(p.y-q.target.y)<=8}
class CoordinateActivity{
 constructor(){this.lesson=0;this.records=LESSONS.map(()=>({done:0,attempts:0,question:null,solved:false}));this.ensureQuestion()}
 get record(){return this.records[this.lesson]}
 get question(){return this.record.question}
 get total(){return this.records.reduce((n,r)=>n+r.done,0)}
 ensureQuestion(){if(!this.record.question)this.record.question=makeQuestion(LESSONS[this.lesson].key)}
 select(n){this.lesson=n;this.ensureQuestion()}
 submit(p){if(this.record.solved||this.record.done>=5)return null;this.record.attempts++;const correct=answerMatches(this.question,p);if(correct){this.record.done++;this.record.solved=true}return correct}
 next(){if(!this.record.solved||this.record.done>=5)return false;this.record.question=makeQuestion(LESSONS[this.lesson].key,this.question);this.record.solved=false;return true}
 restartLesson(){this.records[this.lesson]={done:0,attempts:0,question:null,solved:false};this.ensureQuestion()}
}
</script>

}
function stopFireworks(){cancelAnimationFrame(fireworksFrame);fireworksFrame=0;const canvas=$('fireworks'),ctx=canvas.getContext('2d');if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height)}
function startFireworks(){stopFireworks();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const canvas=$('fireworks'),ctx=canvas.getContext('2d');if(!ctx)return;const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const colors=['#ffda61','#6be4ba','#86c8ff','#ff9dcb','#d0a8ff'];const bursts=[{delay:0,x:.18,y:.27},{delay:190,x:.82,y:.24},{delay:550,x:.5,y:.13},{delay:1050,x:.2,y:.61},{delay:1400,x:.8,y:.57}].map((burst,i)=>({...burst,particles:Array.from({length:68},(_,j)=>{const angle=Math.PI*2*j/68+(Math.random()-.5)*.1;return{angle,speed:(100+Math.random()*170)*Math.min(1,w/800),life:1.25+Math.random()*.7,size:1.4+Math.random()*1.8,color:colors[(i+j)%colors.length]}})}));const began=performance.now();function frame(now){if(!$('celebration').open)return;ctx.clearRect(0,0,w,h);for(const burst of bursts){const age=(now-began-burst.delay)/1000;if(age<0)continue;for(const p of burst.particles){if(age>p.life)continue;const drag=(1-Math.exp(-.8*age))/.8,previous=Math.max(0,age-.045),previousDrag=(1-Math.exp(-.8*previous))/.8,x=burst.x*w+Math.cos(p.angle)*p.speed*drag,y=burst.y*h+Math.sin(p.angle)*p.speed*drag+55*age*age;ctx.globalAlpha=Math.pow(1-age/p.life,.65);ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(burst.x*w+Math.cos(p.angle)*p.speed*previousDrag,burst.y*h+Math.sin(p.angle)*p.speed*previousDrag+55*previous*previous);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,p.size*.65,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;if(now-began<3400)fireworksFrame=requestAnimationFrame(frame);else stopFireworks()}fireworksFrame=requestAnimationFrame(frame)}
function showCelebration(){if(!activity.record.solved||animating||$('celebration').open)return;$('celebration-description').textContent=$('feedback').querySelector('p').textContent;$('celebration-next').textContent=activity.record.done===5?'5문제 완료! →':'다음 문제 →';$('celebration').showModal();startFireworks()}
function advanceQuestion(){if(animating||!activity.record.solved)return;if($('celebration').open)$('celebration').close();if(activity.record.done===5)showCompletion();else{activity.next();renderQuestion();$('mission-title').setAttribute('tabindex','-1');$('mission-title').focus({preventScroll:true})}}
function setFeedback(type,title,description){$('response-bar').className='response-bar'+(type?' '+type:'');$('feedback').replaceChildren();const icon=document.createElement('span'),copy=document.createElement('div'),a=document.createElement('strong'),b=document.createElement('p');icon.className='feedback-icon';icon.setAttribute('aria-hidden','true');icon.textContent=type==='correct'?'✓':type==='wrong'?'↻':'☝';a.textContent=title;b.textContent=description;copy.append(a,b);$('feedback').append(icon,copy)}
function updateProgress(){const lesson=LESSONS[activity.lesson],r=activity.record;$('total-progress').textContent=`${activity.total} / 25`;[0,1,2].forEach(stage=>{$('stage-count-'+stage).textContent=`${activity.records.reduce((sum,r,i)=>sum+(LESSONS[i].stage===stage?r.done:0),0)} / ${stage===0?15:5}`});document.querySelectorAll('.stage-tab').forEach(el=>{if(Number(el.dataset.stage)===lesson.stage)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});document.querySelectorAll('.lesson-tab').forEach(el=>{const i=Number(el.dataset.lesson);el.setAttribute('aria-selected',String(i===activity.lesson));el.querySelector('.small-check').textContent=activity.records[i].done===5?' ✓':''});$('lesson-tabs').hidden=lesson.stage!==0;$('question-count').innerHTML=`${Math.min(5,r.done+(r.solved?0:1))} <span>/ 5</span>`}
function updateNext(){const r=activity.record;$('next').disabled=!r.solved||animating;$('next').textContent=r.solved?(animating?'움직임을 봐요…':r.done===5?'5문제 완료! →':'다음 문제 →'):'먼저 답을 눌러요'}
function direction(axis,n){return (axis==='x'?(n<0?'← 왼쪽':'→ 오른쪽'):(n<0?'↓ 아래쪽':'↑ 위쪽'))+'으로 '+Math.abs(n)}
function howto(q){let steps,reminder;
 if(q.key==='x'){steps=[`빨간 <b>가로 X축</b>에서 <b>${format(q.target.x)}</b>을 찾아요.`,`그 숫자에서 <b>위아래로</b> 살펴봐요.`,`그 줄에 있는 <b>초록색 점</b>을 눌러요.`];reminder='<strong>가로 X는 이렇게 읽어요</strong><span class="x-text">← 왼쪽 −　0　+ 오른쪽 →</span><br>높이가 달라도 X가 같으면 돼요.'}
 else if(q.key==='y'){steps=[`파란 <b>세로 Y축</b>에서 <b>${format(q.target.y)}</b>을 찾아요.`,`그 숫자에서 <b>왼쪽과 오른쪽</b>을 살펴봐요.`,`그 줄에 있는 <b>초록색 점</b>을 눌러요.`];reminder='<strong>세로 Y는 이렇게 읽어요</strong><span class="y-text">↑ 위쪽은 +<br>↓ 아래쪽은 −</span><br>가로 위치가 달라도 괜찮아요.'}
 else if(q.key==='move'){steps=[`<b>지금 위치 ${coord(q.start)}</b>에서 출발해요.`,`가로로 <b>${direction('x',q.delta.x)}</b>,<br>세로로 <b>${direction('y',q.delta.y)}</b> 움직여요.`,`마지막에 도착할 <b>빈 곳</b>을 눌러요.`];reminder='<strong>움직일 값을 더해요</strong>도착 X = 지금 X + X 이동<br>도착 Y = 지금 Y + Y 이동'}
 else{steps=[`빨간 <b>가로 X축</b>에서 <b>${format(q.target.x)}</b>을 찾아요.`,`파란 <b>세로 Y축</b>에서 <b>${format(q.target.y)}</b>을 찾아요.`,`두 위치가 만나는 <b>${q.key==='xy'?'초록색 점':'빈 곳'}</b>을 눌러요.`];reminder='<strong>순서를 기억해요</strong><span class="x-text">X는 가로 ↔</span><br><span class="y-text">Y는 세로 ↕</span><br>좌표는 (X, Y) 순서예요.'}
 $('howto-steps').replaceChildren(...steps.map((copy,i)=>{const li=document.createElement('li');li.innerHTML=`<span class="step">${i+1}</span><span>${copy}</span>`;return li}));$('axis-reminder').innerHTML=reminder;
}
function renderQuestion(){cancelAnimation();if($('celebration').open)$('celebration').close();cursor=null;lastWrong=null;hintOn=false;$('hint').setAttribute('aria-pressed','false');$('hint').textContent='💡 모르겠으면 힌트선 보기';drawGuides();drawHint();const q=activity.question,r=activity.record;
 $('mission-mode').textContent=labels[activity.lesson];const number=(v,axis)=>`<span class="number ${axis==='y'?'y':''}">${format(v)}</span>`;
 if(q.key==='x'){$('mission-title').innerHTML=`가로 X가 ${number(q.target.x,'x')}인 점을 눌러요.`;$('mission-description').innerHTML='아래 <b>A · B · C · D · E</b> 중 <span class="action-word">점 하나를 클릭하세요.</span>'}
 else if(q.key==='y'){$('mission-title').innerHTML=`세로 Y가 ${number(q.target.y,'y')}인 점을 눌러요.`;$('mission-description').innerHTML='아래 <b>A · B · C · D · E</b> 중 <span class="action-word">점 하나를 클릭하세요.</span>'}
 else if(q.key==='xy'){$('mission-title').innerHTML=`X가 ${number(q.target.x,'x')}, Y가 ${number(q.target.y,'y')}인 점을 눌러요.`;$('mission-description').innerHTML='가로와 세로가 <b>모두 맞는</b> <span class="action-word">점 하나를 클릭하세요.</span>'}
 else if(q.key==='hidden'){$('mission-title').innerHTML=`X가 ${number(q.target.x,'x')}, Y가 ${number(q.target.y,'y')}인 곳을 눌러요.`;$('mission-description').innerHTML='이번에는 점이 없어요. 좌표판의 <span class="action-word">빈 곳을 직접 클릭하세요.</span>'}
 else{$('mission-title').textContent='엔트리봇이 움직인 뒤 도착할 곳을 눌러요.';$('mission-description').innerHTML='<span class="action-word">아래 값만큼 움직이면 어디일까요?</span> 좌표판의 빈 곳을 클릭하세요.'}
 $('move-facts').hidden=q.key!=='move';if(q.key==='move')$('move-facts').innerHTML=`<div class="move-fact"><small>지금 위치</small><strong>${coord(q.start)}</strong></div><div class="move-fact x"><small>X ${signed(q.delta.x)}</small><strong>${direction('x',q.delta.x)}</strong></div><div class="move-fact y"><small>Y ${signed(q.delta.y)}</small><strong>${direction('y',q.delta.y)}</strong></div>`;
 $('board-action').textContent=q.points.length?'A · B · C · D · E 중에서 하나를 누르세요.':q.key==='hidden'?'점을 찍을 빈 곳을 누르세요.':'엔트리봇이 도착할 빈 곳을 누르세요.';
 $('board').setAttribute('tabindex',q.points.length?'-1':'0');$('board').setAttribute('aria-label',q.points.length?'좌표판. 표시된 A부터 E까지 점 중 정답을 선택하세요.':'좌표판. 방향키로 10씩, Shift와 방향키로 1씩 이동합니다. Home으로 중심에 돌아가고 Enter로 선택하세요.');$('live-coord').innerHTML='마우스 위치 <span class="x-text">X <b>—</b></span> <span class="y-text">Y <b>—</b></span>';
 howto(q);if(r.solved)correctFeedback();else setFeedback('',q.points.length?'초록색 점 하나를 눌러 보세요.':'답이라고 생각하는 빈 곳을 눌러 보세요.','모르겠으면 ‘힌트선 보기’를 눌러도 괜찮아요.');drawPoints();drawMove();updateProgress();updateNext();requestAnimationFrame(fitBoard);
}
function correctFeedback(){const q=activity.question;let explanation;if(q.key==='x')explanation=`${q.target.label}점은 가로 X가 ${format(q.target.x)}이에요. 다음 문제로 가 볼까요?`;else if(q.key==='y')explanation=`${q.target.label}점은 세로 Y가 ${format(q.target.y)}이에요. 다음 문제로 가 볼까요?`;else if(q.key==='move')explanation=`가로 ${format(q.start.x)} ${q.delta.x<0?'−':'+'} ${Math.abs(q.delta.x)} = ${format(q.target.x)}, 세로 ${format(q.start.y)} ${q.delta.y<0?'−':'+'} ${Math.abs(q.delta.y)} = ${format(q.target.y)} → 도착 ${coord(q.target)}`;else explanation=`가로 X는 ${format(q.target.x)}, 세로 Y는 ${format(q.target.y)}. ${coord(q.target)}을 찾았어요.`;setFeedback('correct','정답! 잘 찾았어요.',explanation)}
function submitAnswer(p){const result=activity.submit(p);if(result===null)return;if(result){lastWrong=null;cursor=null;drawGuides();correctFeedback();drawPoints();updateProgress();if(activity.question.key==='move')animateBot();else{updateNext();showCelebration()}}else{const q=activity.question;lastWrong=p;let hint;if(q.key==='x')hint=`${p.label}점은 가로 X가 ${format(p.x)}이에요. X축의 ${format(q.target.x)}에서 위아래로 살펴봐요.`;else if(q.key==='y')hint=`${p.label}점은 세로 Y가 ${format(p.y)}이에요. Y축의 ${format(q.target.y)}에서 옆으로 살펴봐요.`;else if(q.key==='move')hint='엔트리봇의 지금 위치에서 시작해요. 가로로 움직인 뒤, 세로로 움직일 곳을 생각해 보세요.';else{const dx=q.target.x-p.x,dy=q.target.y-p.y;hint=`지금 누른 곳보다 ${Math.abs(dx)>8?(dx>0?'오른쪽':'왼쪽'):''}${Math.abs(dx)>8&&Math.abs(dy)>8?' · ':''}${Math.abs(dy)>8?(dy>0?'위쪽':'아래쪽'):''}을 살펴봐요. 힌트선을 켜도 좋아요.`}setFeedback('wrong','괜찮아요. 한 번 더 눌러 보세요!',hint);drawPoints()}}
function cursorTo(p){cursor={x:Math.max(-240,Math.min(240,Math.round(p.x))),y:Math.max(-135,Math.min(135,Math.round(p.y)))};$('live-coord').innerHTML=`마우스 위치 <span class="x-text">X <b>${format(cursor.x)}</b></span> <span class="y-text">Y <b>${format(cursor.y)}</b></span>`;drawGuides()}
function fromPointer(e){const ctm=$('board').getScreenCTM();if(!ctm)return null;const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(ctm.inverse());return{x:(pt.x-480)/2,y:(270-pt.y)/2}}
function chooseLesson(n){if($('completion').open)$('completion').close();activity.select(n);renderQuestion()}
function showCompletion(){const all=activity.total===25;$('completion-title').textContent=all?'25문제 모두 찾았어요!':`${labels[activity.lesson]} 5문제 완료!`;$('completion-description').textContent=all?'좌표의 위치도, 움직인 뒤 도착점도 찾았어요. 이제 엔트리에서 움직임 코드를 만들어 봐요.':activity.lesson===0?'가로 X를 잘 찾았어요. 다음에는 세로 Y를 찾아요.':activity.lesson===1?'세로 Y도 잘 찾았어요. 이제 X와 Y를 함께 읽어요.':activity.lesson===2?'X와 Y를 함께 찾았어요. 이제 점이 없는 곳에 직접 찍어 봐요.':activity.lesson===3?'빈 곳에도 점을 잘 찍었어요. 이제 엔트리봇이 도착할 곳을 찾아요.':'도착점을 잘 찾았어요. 아직 안 푼 문제도 이어서 해 봐요.';$('summary-list').hidden=!all;$('summary-list').replaceChildren();if(all)labels.forEach(l=>{const row=document.createElement('div');row.className='summary-row';row.innerHTML=`<span>${l}</span><strong>5 / 5 ✓</strong>`;$('summary-list').append(row)});$('continue').textContent=all?'모두 마쳤어요 ✓':'다음 연습 →';$('completion').showModal()}
document.querySelectorAll('.stage-tab').forEach(el=>el.addEventListener('click',()=>{const stage=Number(el.dataset.stage),indexes=LESSONS.map((l,i)=>l.stage===stage?i:-1).filter(i=>i>=0);chooseLesson(indexes.find(i=>activity.records[i].done<5)??indexes[0])}));
document.querySelectorAll('.lesson-tab').forEach(el=>el.addEventListener('click',()=>chooseLesson(Number(el.dataset.lesson))));
$('next').addEventListener('click',advanceQuestion);$('celebration-next').addEventListener('click',advanceQuestion);$('celebration-review').addEventListener('click',()=>{$('celebration').close();$('next').focus({preventScroll:true})});$('celebration').addEventListener('close',stopFireworks);$('celebration').addEventListener('cancel',()=>requestAnimationFrame(()=>$('next').focus({preventScroll:true})));
$('review').addEventListener('click',()=>{$('completion').close();activity.restartLesson();renderQuestion()});$('continue').addEventListener('click',()=>{$('completion').close();if(activity.total===25)return;const next=activity.records.findIndex((r,i)=>i>activity.lesson&&r.done<5);chooseLesson(next>=0?next:activity.records.findIndex(r=>r.done<5))});
$('reset').addEventListener('click',()=>$('reset-dialog').showModal());$('reset-cancel').addEventListener('click',()=>$('reset-dialog').close());$('reset-confirm').addEventListener('click',()=>{$('reset-dialog').close();activity=new CoordinateActivity();renderQuestion()});
$('hint').addEventListener('click',()=>{hintOn=!hintOn;$('hint').setAttribute('aria-pressed',String(hintOn));$('hint').textContent=hintOn?'💡 힌트선 끄기':'💡 모르겠으면 힌트선 보기';drawHint()});$('guides').addEventListener('change',drawGuides);
$('board').addEventListener('pointermove',e=>{if(activity.record.solved)return;const p=fromPointer(e);if(p)cursorTo(p)});$('board').addEventListener('pointerleave',()=>{cursor=null;drawGuides()});$('board').addEventListener('click',e=>{if(activity.question.points.length)return;const p=fromPointer(e);if(p)submitAnswer({x:Math.round(p.x),y:Math.round(p.y)})});
$('board').addEventListener('keydown',e=>{if(activity.question.points.length||activity.record.solved)return;const d=e.shiftKey?1:10;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' ','Home'].includes(e.key)){e.preventDefault();const p=cursor||{x:0,y:0};if(e.key==='Home')cursorTo({x:0,y:0});else if(e.key==='Enter'||e.key===' ')submitAnswer(p);else cursorTo({x:p.x+(e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0),y:p.y+(e.key==='ArrowUp'?d:e.key==='ArrowDown'?-d:0)})}});
$('fullscreen').hidden=!document.fullscreenEnabled;$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{setFeedback('','브라우저의 전체 화면으로도 볼 수 있어요.','키보드의 F11을 눌러 보세요. 화면 크기는 자동으로 맞춰져요.')}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 전체 화면 끝내기':'⛶ 전체 화면';requestAnimationFrame(fitBoard)});
new ResizeObserver(fitBoard).observe($('board-viewport'));window.addEventListener('resize',()=>requestAnimationFrame(fitBoard));drawGrid();renderQuestion();


</script>
